# A Debian tools tree (what an Ubuntu host such as GitHub's runner gets)
# leaves out the package-manager profile: it adds pacman, zypper and dnf5 to
# build other distributions, and dnf5 is no longer in Debian testing. Of what
# it brings, only the Debian archive keyring is needed here. Other hosts keep
# the default profiles; on Fedora that profile is what provides apt.
[Match]
ToolsTreeDistribution=debian

[Build]
ToolsTreeProfiles=misc,runtime
ToolsTreePackages=debian-archive-keyring
