# Jalea: an immutable Debian built with mkosi, with Nix on top.
#
# The image ships /usr only, as an erofs file system protected by dm-verity.
# Everything writable (/etc, /var, /home, /nix) lives on a LUKS2 volume that
# is created and TPM2-enrolled on the device itself. See README.md.

[Config]
MinimumVersion=27

[Distribution]
Distribution=debian
Release=trixie
Repositories=non-free-firmware

[Build]
ToolsTree=default
ToolsTreePackages=rauc
CacheDirectory=mkosi.cache
History=yes

[Output]
OutputDirectory=mkosi.output
Format=disk
ImageId=jalea
Output=%i_%v
SplitArtifacts=uki,partitions
ManifestFormat=json

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
UnifiedKernelImageFormat=jalea
Locale=C.UTF-8
Timezone=UTC
Keymap=us
Hostname=jalea

# mkosi appends usrhash=<hash> automatically because the usr partition is
# verity protected. systemd-veritysetup-generator then finds the data and
# hash partitions by their GPT UUIDs (the two halves of the hash) and exposes
# /dev/mapper/usr, which we mount as /usr. The root file system is not named
# at all: systemd-gpt-auto-generator finds the LUKS root partition on the
# boot disk and unlocks it with the TPM2. rd.emergency=reboot: if the initrd
# cannot bring up /usr or the root (a bad update), reboot instead of dropping
# to an emergency shell, so the firmware's BootOrder falls back to the other
# slot group. quiet: only kernel errors and slow or failed units reach the
# console, which is tty1 where the login prompt is drawn; the journal keeps
# everything.
KernelCommandLine=
        mount.usr=/dev/mapper/usr
        mount.usrfstype=erofs
        mount.usrflags=ro
        rw
        audit=0
        systemd.firstboot=0
        rd.emergency=reboot
        quiet

Packages=
        # base system
        bash
        bash-completion
        ca-certificates
        coreutils
        curl
        dbus
        findutils
        git
        grep
        gzip
        iproute2
        iputils-ping
        jq
        kmod
        less
        libnss-myhostname
        libnss-resolve
        libnss-systemd
        libpam-systemd
        locales
        login
        mount
        nano
        openssl
        passwd
        pciutils
        procps
        sed
        sudo
        tar
        tzdata
        udev
        usbutils
        util-linux
        util-linux-extra
        xz-utils
        zstd
        # editors and shell tools (helix, the default editor, is not in Debian;
        # mkosi.prepare installs it from upstream)
        bsdextrautils
        file
        man-db
        tmux
        tree
        zsh
        # python for one-off scripts: standard library only, no pip (there is no
        # writable /usr to install into); modules come from Nix. Also what
        # systemd-ukify runs on.
        python3
        # debugging and diagnostics (smartd is disabled in the preset: only
        # smartctl is wanted; bpftrace needs no headers, Debian's kernel has BTF)
        bpftrace
        dmidecode
        ethtool
        htop
        iotop
        linux-perf
        lsof
        nvme-cli
        smartmontools
        strace
        sysstat
        tcpdump
        # Tailscale, from its own apt repository (mkosi.sandbox/); pulls iptables
        tailscale
        # sway, a Wayland compositor. It pulls swaybg and Mesa's DRI drivers
        # (the NUC's Intel iGPU). The rest are what its default config
        # expects: foot as the terminal, wmenu as the launcher, the stock
        # wallpaper, and one font for the bar and the terminal (Recommends
        # are not installed).
        sway
        foot
        wmenu
        sway-backgrounds
        fonts-dejavu-core
        # greetd runs tuigreet on tty1 in place of the getty and starts sway
        # for whoever logs in there (usr/share/factory/etc/greetd/config.toml)
        greetd
        tuigreet
        # btrfs snapshots of the data volume
        snapper
        # systemd, including the pieces Debian splits out
        systemd
        systemd-boot
        systemd-boot-efi
        systemd-cryptsetup
        systemd-repart
        systemd-resolved
        systemd-sysv
        systemd-timesyncd
        systemd-ukify
        # kernel and firmware for an Intel NUC 13 Pro (and QEMU). trixie keeps
        # the i915 GuC/DMC blobs in firmware-intel-graphics; without them the
        # display comes up but i915 declares the GPU wedged and Mesa cannot
        # use it.
        linux-image-amd64
        intel-microcode
        firmware-intel-graphics
        firmware-iwlwifi
        firmware-misc-nonfree
        firmware-sof-signed
        iwd
        # storage: LUKS2 root, btrfs subvolumes, TPM2
        btrfs-progs
        cryptsetup-bin
        dosfstools
        efibootmgr
        fdisk
        tpm2-tools
        # A/B updates (the daemon and its D-Bus activation are a separate package)
        rauc
        rauc-service
        # Nix, from Debian's own archive
        nix-bin
        nix-setup-systemd
        # remote access
        openssh-server

# apt has no writable root to work on, so it is not part of the image.
RemovePackages=
        apt
        apt-utils

[Validation]
# No signing in this release: verity hash only, no Secure Boot, no PCR policy.
SecureBoot=no
SignExpectedPcr=no
Verity=hash

[Runtime]
# Room for systemd-repart to create the LUKS root on first boot.
RuntimeSize=16G
RAM=4G
CPUs=4
TPM=yes
Firmware=uefi
