# Extra configuration for the default initrd mkosi builds; mkosi.extra/ next
# to this file is added to it.
[Content]
# The udev rule that pins /dev/disk symlinks to the system disk, and the
# helper it runs, so an inserted installer stick cannot be picked as /usr.
ExtraTrees=
        ../mkosi.extra/usr/lib/jalea/system-disk:/usr/lib/jalea/system-disk
        ../mkosi.extra/usr/lib/udev/rules.d/61-jalea-system-disk.rules:/usr/lib/udev/rules.d/61-jalea-system-disk.rules
