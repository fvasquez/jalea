# If the initrd cannot bring up /usr or the root (for example after a bad
# update), reboot instead of dropping to a shell nobody is watching. BootNext
# has been consumed by then, so the firmware boots the first entry in
# BootOrder, which is the previously good slot group. systemd 257 does not
# implement rd.emergency=reboot yet; this drop-in does the same job.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'echo "Jalea: boot failed in the initrd, rebooting in 10 s to fall back to the other slot group" > /dev/console; sleep 10; systemctl --force reboot'
