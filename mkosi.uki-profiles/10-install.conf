# Second UKI profile: the installer. systemd-boot shows it as a menu entry
# when booting from the USB stick. Root is a tmpfs, /usr is the same verity
# protected image the installed system will run, and nothing is created on
# the boot medium (systemd-repart is masked).
[UKIProfile]
Profile=
        ID=install
        TITLE=Install Jalea to a disk

# The verity devices are named through /dev/jalea/, which only partitions
# on the disk we booted from get: a target that already holds this build has
# usr/verity partitions with the same UUIDs, and the by-partuuid lookup can
# pick them before the (slower) USB stick has even appeared.
Cmdline=
        root=tmpfs
        systemd.verity_usr_data=/dev/jalea/usr_a
        systemd.verity_usr_hash=/dev/jalea/verity_a
        mount.usr=/dev/mapper/usr
        mount.usrfstype=erofs
        mount.usrflags=ro
        rd.systemd.mask=systemd-repart.service
        systemd.mask=systemd-repart.service
        systemd.unit=jalea-installer.target
        rw
        audit=0
        systemd.firstboot=0
        rd.emergency=reboot
        quiet
