# Slot group A: EFI partition. Holds shim at EFI/BOOT/BOOTX64.EFI (the
# fallback path, used by the USB installer and if firmware NVRAM is lost),
# which loads systemd-boot from EFI/BOOT/grubx64.efi; MokManager; the UKI at
# EFI/Linux/jalea.efi, which the "A" firmware boot entry has shim load
# directly; and jalea-secureboot.cer, the certificate to enroll as a MOK.
[Partition]
Type=esp
Label=esp_a
Format=vfat
CopyFiles=/efi:/
CopyFiles=/boot:/
SizeMinBytes=256M
SizeMaxBytes=256M
SplitName=esp
