# Slot group A: EFI partition. Holds systemd-boot (as the fallback loader at
# EFI/BOOT/BOOTX64.EFI, used by the USB installer and if firmware NVRAM is
# lost) and the UKI at EFI/Linux/jalea.efi, which the "A" firmware boot entry
# loads directly.
[Partition]
Type=esp
Label=esp_a
Format=vfat
CopyFiles=/efi:/
CopyFiles=/boot:/
SizeMinBytes=256M
SizeMaxBytes=256M
SplitName=esp
