# Jalea's defaults for foot, the terminal sway opens with Mod+Enter. Found
# through XDG_CONFIG_DIRS (set in /etc/profile.d/jalea-xdg.sh), so they
# change with each update. foot takes the first file it finds and reads no
# other: ~/.config/foot/foot.ini or /etc/xdg/foot/foot.ini replaces this
# one as a whole. foot.ini(5) lists every option. Sized, like the sway
# defaults, for a 4K display seen from a distance.
[main]
font=monospace:size=14
