# Jalea's defaults for sway, read after Debian's /etc/sway/config through
# /etc/sway/config.d/10-jalea.conf, so they change with each update. Sized
# for a 4K display seen from a distance (a TV): 2x scaling for every client
# and a larger font for sway's own bar and window titles. Override in a
# later file under /etc/sway/config.d/ (say 20-local.conf; the last setting
# wins) or with your own ~/.config/sway/config.
output * scale 2
font pango:monospace 14
