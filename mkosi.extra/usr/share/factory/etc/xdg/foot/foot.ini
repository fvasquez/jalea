# Jalea's defaults for foot, the terminal sway opens with Mod+Enter. This
# replaces Debian's sample file, which is entirely comments; foot.ini(5)
# lists every option. A ~/.config/foot/foot.ini takes precedence over this
# file as a whole. Sized, like the sway defaults, for a 4K display seen from
# a distance.
[main]
font=monospace:size=14
