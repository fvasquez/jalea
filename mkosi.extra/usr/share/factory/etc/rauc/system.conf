# RAUC system configuration for Jalea.
#
# Two redundant slot groups, A and B. Each holds a UKI on its own EFI
# partition plus a verity-protected usr partition and its hash tree. The
# firmware boots a group directly through an EFI boot entry named after it
# ("A" or "B"). /usr/lib/jalea/rauc-bootloader switches groups with BootNext,
# and "rauc status mark-good" makes the switch permanent by moving the entry
# to the front of BootOrder. The encrypted root partition is not a slot and
# is never written by an update.

[system]
compatible=jalea-x86-64
bootloader=custom
bundle-formats=-plain
data-directory=/var/lib/rauc

[handlers]
bootloader-custom-backend=/usr/lib/jalea/rauc-bootloader

[keyring]
path=/etc/rauc/keyring.pem

# --- slot group A -----------------------------------------------------------

[slot.usr.0]
device=/dev/disk/by-partlabel/usr_a
type=raw
bootname=A
install-same=false

[slot.verity.0]
device=/dev/disk/by-partlabel/verity_a
type=raw
parent=usr.0
install-same=false

[slot.efi.0]
device=/dev/disk/by-partlabel/esp_a
type=vfat
parent=usr.0

# --- slot group B -----------------------------------------------------------

[slot.usr.1]
device=/dev/disk/by-partlabel/usr_b
type=raw
bootname=B
install-same=false

[slot.verity.1]
device=/dev/disk/by-partlabel/verity_b
type=raw
parent=usr.1
install-same=false

[slot.efi.1]
device=/dev/disk/by-partlabel/esp_b
type=vfat
parent=usr.1
