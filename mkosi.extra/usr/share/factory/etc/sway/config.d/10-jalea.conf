# Pulls in Jalea's sway defaults, which live with the image and change with
# each update. /etc is on the data volume and the factory merge never
# overwrites what is already there, so this file stays a one-liner: put
# overrides in a later file here (say 20-local.conf) or in
# ~/.config/sway/config.
include /usr/share/jalea/sway/*.conf
