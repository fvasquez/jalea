# Jalea defaults for sway, read after Debian's /etc/sway/config. Sized for a
# 4K display seen from a distance (a TV): 2x scaling for every client and
# a larger font for sway's own bar and window titles. Edit or delete this
# file on the device; /etc is on the data volume and the factory merge never
# overwrites what is already there.
output * scale 2
font pango:monospace 14
