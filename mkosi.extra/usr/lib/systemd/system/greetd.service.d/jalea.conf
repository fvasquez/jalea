# Debian's unit puts the greeter on tty7. Jalea runs it on tty1 (see
# usr/share/factory/etc/greetd/config.toml) in place of the login getty, so
# the two must not fight over the VT. Conflicts= and After= are additive;
# the tty7 lines in the packaged unit stay and are harmless.
[Unit]
Conflicts=getty@tty1.service
After=getty@tty1.service
