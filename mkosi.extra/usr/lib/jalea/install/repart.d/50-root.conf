# The only writable partition. Created on first boot by systemd-repart from
# the initrd (or by the installer), LUKS2 encrypted with a key sealed to the
# TPM2, formatted btrfs. /var, /home and /nix are subvolumes so they can be
# snapshotted and quota'd independently. Never touched by RAUC updates.
[Partition]
UUID=@RANDOM_UUID@
Type=root
Label=data
Format=btrfs
Encrypt=tpm2
FactoryReset=yes
# Created at its final size; systemd-growfs cannot resize a TPM2-unlocked LUKS volume anyway.
GrowFileSystem=off
SizeMinBytes=4G
Weight=10000
Subvolumes=/var /home /nix
# Merged-/usr compatibility symlinks (bin, lib, lib64, sbin).
CopyFiles=/usr/share/jalea/root-skeleton:/
MakeDirectories=/usr /etc /boot /efi /dev /proc /sys /run /tmp /root /srv /opt /mnt /var /home /nix /var/log/journal /var/tmp
