# The image ships /usr only, so the dpkg database would be lost with /var.
# mkosi.finalize moves it into the factory tree; link it back so that
# "dpkg -l" and "dpkg -S" still answer "what did Debian ship?". It is
# read-only, like everything else under /usr.
L /var/lib/dpkg - - - - /usr/share/factory/var/lib/dpkg
