# /etc lives on the writable root and starts empty. On every boot, merge the
# factory copy of Debian's /etc (captured at image build time, see
# mkosi.finalize) into it without overwriting anything that already exists.
# Files the administrator changed stay as they are; defaults that a new image
# version adds show up automatically.
C+! /etc - - - - /usr/share/factory/etc

# Merged-/usr compatibility symlinks, in case the root was not created from
# the skeleton (e.g. a hand-made root file system).
L /bin - - - - usr/bin
L /lib - - - - usr/lib
L /lib64 - - - - usr/lib64
L /sbin - - - - usr/sbin
